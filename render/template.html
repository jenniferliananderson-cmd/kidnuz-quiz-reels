<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidNuz quiz renderer</title>
<style>
/* Fonts ship with the project (SIL Open Font License, see assets/fonts) so rendering never depends on a download. */
@font-face{font-family:Fraunces;font-style:normal;font-weight:100 900;font-display:block;src:url(../assets/fonts/fraunces-latin-opsz-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Fraunces;font-style:normal;font-weight:100 900;font-display:block;src:url(../assets/fonts/fraunces-latin-ext-opsz-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Poppins;font-style:normal;font-weight:500;font-display:block;src:url(../assets/fonts/poppins-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Poppins;font-style:normal;font-weight:500;font-display:block;src:url(../assets/fonts/poppins-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:block;src:url(../assets/fonts/poppins-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:block;src:url(../assets/fonts/poppins-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Production renderer for the approved KidNuz Quiz Reel design.
   The pipeline calls setup({...}) once, then renderAt(t) for every frame and screenshots #reel. */
html,body{margin:0;padding:0;background:#000}
.reel{--cg:#2b3a8f;--k:#fff;--in:3.5cqw;--cr:4cqw;--g1:rgba(4,176,210,.35);--g2:rgba(239,68,42,.28);--cb:#fbba22;--ck:#22307a;--lb:#04b0d2;--lk:#fff;--wv:#04b0d2;
  position:relative;width:1080px;aspect-ratio:9/16;container-type:inline-size;color:var(--k);overflow:hidden;font-family:Poppins,system-ui,sans-serif}
.reel.feed{aspect-ratio:4/5}
.reel.feed .wave{display:none}
.card{position:absolute;inset:var(--in);background:var(--cg);border-radius:var(--cr);overflow:hidden}
.glow{position:absolute;inset:-20%;background:radial-gradient(60% 40% at 82% 16%,var(--g1),transparent 70%),radial-gradient(55% 35% at 8% 94%,var(--g2),transparent 70%)}
.logo{position:absolute;left:8cqw;top:8cqw;width:46cqw}
.logo img{display:block;width:100%;height:auto}
.tab{position:absolute;left:12cqw;top:52.5cqw;color:#fbba22;font-weight:600;font-size:4.2cqw;line-height:1.3;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.q{position:absolute;left:12cqw;right:8cqw;top:61cqw;font-family:Fraunces,Georgia,serif;font-optical-sizing:auto;font-weight:400;line-height:1.12;letter-spacing:-.01em;text-wrap:pretty;text-align:left}
.q span{display:inline-block;opacity:0;white-space:pre}
.cta,.lk{position:absolute;font-family:Fraunces,Georgia,serif;font-optical-sizing:auto;font-weight:500;line-height:1.1;opacity:0}
.cta{left:12cqw;max-width:74cqw;top:144cqw;background:var(--cb);color:var(--ck);border-radius:5cqw;transform-origin:12% 120%}
.cta::after{content:"";position:absolute;left:9cqw;bottom:-4.2cqw;border:2.5cqw solid transparent;border-top:2.3cqw solid var(--cb);border-left:2.5cqw solid var(--cb)}
.lk{display:flex;right:11cqw;top:123cqw;background:var(--lb);color:var(--lk);border-radius:4.5cqw;transform-origin:88% 120%;box-shadow:0 1.2cqw 0 rgba(10,20,70,.22)}
.lk::after{content:"";position:absolute;right:7cqw;bottom:-3.8cqw;border:2.2cqw solid transparent;border-top:2cqw solid var(--lb);border-right:2.2cqw solid var(--lb)}
.wave{position:absolute;left:12cqw;right:8cqw;top:117cqw;height:7cqw;display:flex;align-items:center;gap:1.1cqw}
.wave i{flex:1;background:var(--wv);border-radius:1cqw;height:20%}
.snd{position:absolute;right:8cqw;top:11cqw;display:flex;align-items:center;gap:1.6cqw;background:#fbba22;color:#22307a;
  font-weight:600;font-size:4.2cqw;letter-spacing:.04em;padding:2cqw 3.6cqw 2cqw 3cqw;border-radius:10cqw;box-shadow:0 1cqw 0 rgba(10,20,70,.22)}
.snd svg{width:6cqw;height:6cqw}
.reel.feed .snd{display:none} /* the feed still is a photo, so no sound badge */
</style>
</head>
<body>
<div class="reel" id="reel">
  <div class="card"><div class="glow"></div></div>
  <div class="logo"><img id="logoimg" src="../assets/logo-white-wordmark.png" alt=""></div>
  <div class="snd" id="snd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path d="M16 9a4.2 4.2 0 0 1 0 6"/><path d="M18.8 6.4a8 8 0 0 1 0 11.2"/></svg>Sound on</div>
  <div class="tab" id="tab">Today on KidNuz</div>
  <div class="q" id="q"></div>
  <div class="wave" id="wave"></div>
  <div class="lk" id="lk">kidnuz.org/podcast</div>
  <div class="cta" id="cta">Listen to find out</div>
</div>
<script>
{
  // Monday..Friday frame colours
  const FRAMES = ['#04b0d2', '#fbba22', '#ef442a', '#ffffff', '#3fb54a'];
  const $ = id => document.getElementById(id);
  const reel = $('reel'), q = $('q'), wave = $('wave'), cta = $('cta'), lk = $('lk'), tab = $('tab'), logo = document.querySelector('.logo');
  wave.innerHTML = Array.from({length: 28}, () => '<i></i>').join('');
  const bars = [...wave.children];
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  const back = x => { x = Math.min(Math.max(x, 0), 1); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const clamp01 = x => Math.min(Math.max(x, 0), 1);
  let C, plan, spans;

  // cfg: {day: 0-4, text, audio: seconds, wordTimes: [seconds from audio start, one per word], format: 'reel'|'feed'}
  window.setup = cfg => {
    C = cfg;
    const feed = cfg.format === 'feed';
    reel.classList.toggle('feed', feed);
    reel.style.background = FRAMES[cfg.day] || FRAMES[0];
    const words = cfg.text.split(/\s+/).filter(Boolean);
    q.innerHTML = words.map((w, k) => `<span>${w.replace(/&/g, '&amp;').replace(/</g, '&lt;')}${k < words.length - 1 ? ' ' : ''}</span>`).join('');
    spans = [...q.children];
    const cq = reel.clientWidth / 100, toCq = px => px / cq, n = cfg.text.length;
    const L = feed ? {logoW: 26, tabTop: 29, qTop: 37, bub: 5.6} : {logoW: 40, tabTop: 44, qTop: 52.5, bub: 6.8};
    // left alignment: the K of the wordmark starts 111px into the 640px-wide logo and sits on the text line TL
    const TL = feed ? 12 : 14.5, K = 111 / 640;
    logo.style.width = L.logoW + 'cqw'; logo.style.left = (TL - K * L.logoW) + 'cqw';
    for (const el of [tab, q, cta, wave]) el.style.left = TL + 'cqw';
    cta.style.maxWidth = (92 - TL - 4) + 'cqw';
    // 'Sound on' badge centred on the logo's height
    const logoH = L.logoW * 375 / 640, snd = document.getElementById('snd');
    snd.style.top = (8 + logoH / 2) + 'cqw'; snd.style.transform = 'translateY(-50%)'; tab.style.top = L.tabTop + 'cqw'; q.style.top = L.qTop + 'cqw';
    for (const el of [cta, lk]) { el.style.fontSize = L.bub + 'cqw'; el.style.padding = (L.bub * 0.62) + 'cqw ' + (L.bub * 0.8) + 'cqw'; }
    let qLimit;
    if (feed) {
      const H = reel.clientHeight / cq, tail = 4;
      const ctaTop = H - 3.5 - 4.5 - tail - toCq(cta.offsetHeight);
      const lkTop = ctaTop - 1.5 - tail - toCq(lk.offsetHeight);
      cta.style.top = ctaTop + 'cqw'; lk.style.top = lkTop + 'cqw';
      qLimit = lkTop - 3.5;
    } else {
      cta.style.top = ''; lk.style.top = '';
      qLimit = 112;
    }
    let fs = feed ? (n < 50 ? 10.5 : n < 90 ? 8.4 : 7.4) : (n < 50 ? 12 : n < 90 ? 9.8 : 8.6);
    q.style.fontSize = fs + 'cqw';
    while (fs > 4.2 && toCq(q.offsetTop + q.offsetHeight) > qLimit) { fs -= 0.2; q.style.fontSize = fs + 'cqw'; }
    const a0 = 0.9, a1 = a0 + cfg.audio;
    plan = {a0, a1, cta: a1 + 0.5, link: a1 + 1.3, end: a1 + 4.6};
    if (!cfg.wordTimes || cfg.wordTimes.length !== words.length) {
      cfg.wordTimes = words.map((w, k) => (k / words.length) * cfg.audio * 0.92);
    }
    return {duration: feed ? 0 : plan.end, audioStart: a0, fontSize: fs};
  };

  window.renderAt = t => {
    if (C.format === 'feed') t = 1e6;
    logo.style.opacity = ease(t / 0.5);
    logo.style.transform = `translateY(${(1 - ease(t / 0.5)) * -5}cqw)`;
    tab.style.opacity = ease((t - 0.25) / 0.4);
    tab.style.transform = `translateX(${(1 - ease((t - 0.25) / 0.45)) * -6}cqw)`;
    spans.forEach((el, k) => {
      const raw = (t - (plan.a0 + C.wordTimes[k])) / 0.3;
      el.style.opacity = clamp01(raw * 3);
      el.style.transform = `scale(${0.55 + 0.45 * back(raw)})`;
    });
    const talking = t > plan.a0 && t < plan.a1;
    wave.style.opacity = clamp01((t - plan.a0 + 0.3) / 0.3) * (1 - clamp01((t - plan.a1) / 0.4));
    // C.levels: loudness of the real clip, 30 values per second, 0..1, so the bars follow the host's voice
    const lv = C.levels && talking ? (C.levels[Math.min(C.levels.length - 1, Math.max(0, Math.floor((t - plan.a0) * 30)))] || 0) : null;
    bars.forEach((b, k) => {
      const shape = Math.abs(Math.sin(t * 7.3 + k * 0.9) * Math.sin(t * 3.1 + k * 0.37));
      // never shorter than ~a third, so quiet moments don't turn the bars into a dotted line
      const h = !talking ? 18 : lv === null ? 22 + 70 * shape : 32 + 66 * lv * (0.45 + 0.55 * shape);
      b.style.height = h + '%';
    });
    cta.style.opacity = clamp01((t - plan.cta) / 0.15);
    cta.style.transform = `scale(${Math.max(back((t - plan.cta) / 0.45), 0)})`;
    const lt = t - plan.link;
    lk.style.opacity = clamp01(lt / 0.15);
    lk.style.transform = `scale(${Math.max(back(lt / 0.45), 0)})`;
  };
}
</script>
</body>
</html>
